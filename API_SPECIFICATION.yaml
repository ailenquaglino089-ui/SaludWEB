openapi: 3.0.3
info:
  title: SaludWEB API
  description: >
    API REST para Sistema de Gestión Médica (Programación IV).
    
    Esta es la especificación oficial del contrato entre Frontend y Backend.
    
    **Arquitectura:**
    - Backend: PHP 7.4+ con arquitectura MVC (Controllers → Services → Repositories)
    - Autenticación: Token simple (base64 encoded user_id:timestamp)
    - Base de Datos: MySQL 5.7+
    
    **Estado de Desarrollo:**
    - v1.0: Endpoints CRUD completados
    - Próximo: Paginación, filtros avanzados
    
  contact:
    name: Ailen Quaglino
    email: ailenquaglino089@gmail.com
  version: 1.0.0

servers:
  - url: http://localhost/Workspace_SaludWEB/repositorio_backend
    description: Desarrollo local (XAMPP)
  - url: https://api.saludweb.com
    description: Producción (pendiente deployment)

tags:
  - name: Health
    description: Verificación de disponibilidad
  - name: Autenticación
    description: Registro, login, gestión de sesiones
  - name: Médicos
    description: CRUD de médicos y especialistas
  - name: Pacientes
    description: CRUD de pacientes
  - name: Prescripciones
    description: CRUD de prescripciones y medicamentos

paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Health check del API
      description: Verifica que el servidor y la base de datos están disponibles
      operationId: getHealth
      responses:
        '200':
          description: Servidor operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-09-13T10:30:00Z"
                  message:
                    type: string
                    example: "API SaludWEB v1.0"

  # ==================== AUTENTICACIÓN ====================

  /api/auth/registro:
    post:
      tags:
        - Autenticación
      summary: Registrar nuevo usuario
      description: Crea un nuevo usuario en el sistema con contraseña encriptada
      operationId: registro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - nombre
                - tipo_usuario
              properties:
                email:
                  type: string
                  format: email
                  example: juan@example.com
                password:
                  type: string
                  minLength: 6
                  example: password123
                nombre:
                  type: string
                  example: Juan Pérez
                tipo_usuario:
                  type: string
                  enum: [paciente, medico, admin]
                  example: paciente
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: Autentica un usuario y devuelve un token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: juan@example.com
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Usuario'
                  - type: object
                    properties:
                      token:
                        type: string
                        example: "MTo1MjYwMTAwMDA="
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags:
        - Autenticación
      summary: Cerrar sesión
      description: Invalida el token del usuario actual
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sesión cerrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Sesión cerrada correctamente"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/usuario-actual:
    get:
      tags:
        - Autenticación
      summary: Obtener usuario autenticado
      description: Retorna los datos del usuario que realizó la petición
      operationId: getUsuarioActual
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Datos del usuario actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/cambiar-contraseña:
    patch:
      tags:
        - Autenticación
      summary: Cambiar contraseña
      description: Actualiza la contraseña del usuario autenticado
      operationId: cambiarContrasena
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password_actual
                - password_nueva
              properties:
                password_actual:
                  type: string
                  example: password123
                password_nueva:
                  type: string
                  minLength: 6
                  example: newpassword456
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Contraseña actualizada correctamente"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ==================== MÉDICOS ====================

  /api/medicos:
    get:
      tags:
        - Médicos
      summary: Listar todos los médicos
      description: Obtiene la lista completa de médicos registrados
      operationId: listMedicos
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Número de página (pendiente implementación)
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Resultados por página (pendiente implementación)
      responses:
        '200':
          description: Lista de médicos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Medico'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Médicos
      summary: Crear nuevo médico
      description: Registra un nuevo médico en el sistema
      operationId: createMedico
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicoCrear'
      responses:
        '201':
          description: Médico creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medico'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/medicos/{medicoId}:
    get:
      tags:
        - Médicos
      summary: Obtener detalle de médico
      description: Obtiene la información completa de un médico específico
      operationId: getMedico
      security:
        - BearerAuth: []
      parameters:
        - name: medicoId
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Detalle del médico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medico'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Médicos
      summary: Actualizar médico
      description: Actualiza la información completa de un médico
      operationId: updateMedico
      security:
        - BearerAuth: []
      parameters:
        - name: medicoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicoCrear'
      responses:
        '200':
          description: Médico actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medico'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags:
        - Médicos
      summary: Eliminar médico
      description: Elimina un médico del sistema
      operationId: deleteMedico
      security:
        - BearerAuth: []
      parameters:
        - name: medicoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Médico eliminado (sin contenido)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== PACIENTES ====================

  /api/pacientes:
    get:
      tags:
        - Pacientes
      summary: Listar todos los pacientes
      description: Obtiene la lista completa de pacientes registrados
      operationId: listPacientes
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de pacientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Paciente'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Pacientes
      summary: Crear nuevo paciente
      description: Registra un nuevo paciente en el sistema
      operationId: createPaciente
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PacienteCrear'
      responses:
        '201':
          description: Paciente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paciente'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/pacientes/{pacienteId}:
    get:
      tags:
        - Pacientes
      summary: Obtener detalle de paciente
      description: Obtiene la información completa de un paciente específico
      operationId: getPaciente
      security:
        - BearerAuth: []
      parameters:
        - name: pacienteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalle del paciente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paciente'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Pacientes
      summary: Actualizar paciente
      description: Actualiza la información completa de un paciente
      operationId: updatePaciente
      security:
        - BearerAuth: []
      parameters:
        - name: pacienteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PacienteCrear'
      responses:
        '200':
          description: Paciente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paciente'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags:
        - Pacientes
      summary: Eliminar paciente
      description: Elimina un paciente del sistema
      operationId: deletePaciente
      security:
        - BearerAuth: []
      parameters:
        - name: pacienteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Paciente eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== PRESCRIPCIONES ====================

  /api/prescripciones:
    get:
      tags:
        - Prescripciones
      summary: Listar todas las prescripciones
      description: Obtiene la lista completa de prescripciones registradas
      operationId: listPrescripciones
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de prescripciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prescripcion'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Prescripciones
      summary: Crear nueva prescripción
      description: Registra una nueva prescripción en el sistema
      operationId: createPrescripcion
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescripcionCrear'
      responses:
        '201':
          description: Prescripción creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescripcion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/prescripciones/{prescripcionId}:
    get:
      tags:
        - Prescripciones
      summary: Obtener detalle de prescripción
      description: Obtiene la información completa de una prescripción específica
      operationId: getPrescripcion
      security:
        - BearerAuth: []
      parameters:
        - name: prescripcionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalle de la prescripción
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescripcion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Prescripciones
      summary: Actualizar prescripción
      description: Actualiza la información completa de una prescripción
      operationId: updatePrescripcion
      security:
        - BearerAuth: []
      parameters:
        - name: prescripcionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescripcionCrear'
      responses:
        '200':
          description: Prescripción actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescripcion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags:
        - Prescripciones
      summary: Eliminar prescripción
      description: Elimina una prescripción del sistema
      operationId: deletePrescripcion
      security:
        - BearerAuth: []
      parameters:
        - name: prescripcionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Prescripción eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/prescripciones/{prescripcionId}/estado:
    patch:
      tags:
        - Prescripciones
      summary: Cambiar estado de prescripción
      description: Modifica el estado de una prescripción (activa, vencida, dispensada, cancelada)
      operationId: changePrescripcionEstado
      security:
        - BearerAuth: []
      parameters:
        - name: prescripcionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - estado
              properties:
                estado:
                  type: string
                  enum: [activa, vencida, dispensada, cancelada]
                  example: dispensada
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescripcion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  schemas:
    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
        nombre:
          type: string
        tipo_usuario:
          type: string
          enum: [paciente, medico, admin]
        activo:
          type: boolean
          default: true

    Medico:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
          example: "Dr. Carlos García"
        email:
          type: string
          format: email
        especialidad:
          type: string
          example: "Cardiología"
        telefono:
          type: string
          example: "+54 9 11 1234-5678"
        licencia:
          type: string
          example: "MP-123456"
        activo:
          type: boolean

    MedicoCrear:
      type: object
      required:
        - nombre
        - email
        - especialidad
        - licencia
      properties:
        nombre:
          type: string
        email:
          type: string
          format: email
        especialidad:
          type: string
        telefono:
          type: string
        licencia:
          type: string
        activo:
          type: boolean
          default: true

    Paciente:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        dni:
          type: string
          example: "12345678"
        email:
          type: string
          format: email
        telefono:
          type: string
        direccion:
          type: string
        fecha_nacimiento:
          type: string
          format: date
        obra_social:
          type: string

    PacienteCrear:
      type: object
      required:
        - nombre
        - dni
        - email
        - fecha_nacimiento
      properties:
        nombre:
          type: string
        dni:
          type: string
        email:
          type: string
          format: email
        telefono:
          type: string
        direccion:
          type: string
        fecha_nacimiento:
          type: string
          format: date
        obra_social:
          type: string

    Prescripcion:
      type: object
      properties:
        id:
          type: integer
        id_paciente:
          type: integer
        id_medico:
          type: integer
        medicamento:
          type: string
        dosis:
          type: string
        frecuencia:
          type: string
        duracion_dias:
          type: integer
        fecha_prescripcion:
          type: string
          format: date
        estado:
          type: string
          enum: [activa, vencida, dispensada, cancelada]
        notas:
          type: string
        paciente_nombre:
          type: string
        medico_nombre:
          type: string

    PrescripcionCrear:
      type: object
      required:
        - id_paciente
        - id_medico
        - medicamento
        - dosis
      properties:
        id_paciente:
          type: integer
        id_medico:
          type: integer
        medicamento:
          type: string
        dosis:
          type: string
        frecuencia:
          type: string
        duracion_dias:
          type: integer
        fecha_prescripcion:
          type: string
          format: date
        notas:
          type: string
        estado:
          type: string
          enum: [activa, vencida, dispensada, cancelada]
          default: activa

    ErrorResponse:
      type: object
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                code:
                  type: string
                message:
                  type: string
                details:
                  type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                      message:
                        type: string
                      code:
                        type: string

  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: No autenticado o token inválido
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Usuario no autenticado"

    Forbidden:
      description: Sin permisos para realizar esta acción
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Acceso denegado"

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Recurso no encontrado"

    UnprocessableEntity:
      description: Validación de negocio falló
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: base64
      description: Token obtenido en login. Formato "user_id:timestamp" en base64
